[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alephgeo"
version = "0.2.0"
description = "Level Up Studio Aleph: capture Street View, satellite imagery, terrain, and OpenStreetMap data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "numpy>=1.25", "truststore>=0.10", "pywebview>=6.2.1,<7"]

[project.scripts]
alephgeo = "alephgeo.__main__:main"

[tool.setuptools.packages.find]
include = ["alephgeo*"]

[tool.setuptools.package-data]
alephgeo = ["web/*", "web/icons/*"]
